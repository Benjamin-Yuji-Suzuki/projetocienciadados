[package]
name = "projeto_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Polars: pandas do Rust
polars = { version = "0.46", features = [
    "lazy", "parquet", "strings", "dtype-date", "dtype-datetime",
    "dtype-struct", "dtype-categorical", "describe", "pivot", "rows"
] }

# ML - Árvore de Decisão
smartcore = "0.3"

# Serializacao de modelos/config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Metadados e utilidades
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
